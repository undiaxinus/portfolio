<header class="fixed w-full top-0 z-50 bg-[#FDFBEE]/80 dark:bg-[#015551]/80 backdrop-blur-lg border-b border-[#57B4BA]/10">
  <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center space-x-2">
        <span class="text-2xl font-bold bg-gradient-to-r from-[#015551] to-[#57B4BA] dark:from-[#57B4BA] dark:to-[#FDFBEE] text-transparent bg-clip-text">JBA</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/about" 
           routerLinkActive="text-[#FE4F2D]"
           class="text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors">
          About
        </a>
        <a routerLink="/portfolio" 
           routerLinkActive="text-[#FE4F2D]"
           class="text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors">
          Portfolio
        </a>
        <a routerLink="/services" 
           routerLinkActive="text-[#FE4F2D]"
           class="text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors">
          Services
        </a>
        <!-- <a routerLink="/testimonials" 
           routerLinkActive="text-[#FE4F2D]"
           class="text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors">
          Testimonials
        </a> -->
        <a routerLink="/contact" 
           routerLinkActive="text-[#FE4F2D]"
           class="text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors">
          Contact
        </a>
      </div>

      <!-- Theme Toggle & Mobile Menu Button -->
      <div class="flex items-center space-x-4">
        <button (click)="toggleDarkMode()" 
                class="p-2 rounded-lg bg-[#57B4BA]/10 text-[#015551] dark:text-[#FDFBEE] hover:bg-[#57B4BA]/20 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
            </path>
      </svg>
    </button>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMenu()" 
                class="md:hidden p-2 rounded-lg bg-[#57B4BA]/10 text-[#015551] dark:text-[#FDFBEE] hover:bg-[#57B4BA]/20 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="isMenuOpen" 
         class="md:hidden absolute top-16 left-0 right-0 bg-[#FDFBEE] dark:bg-[#015551] border-b border-[#57B4BA]/10 shadow-lg">
      <div class="px-4 py-6 space-y-4">
        <a routerLink="/about" 
           routerLinkActive="text-[#FE4F2D]"
           class="block text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors"
           (click)="toggleMenu()">
          About
        </a>
        <a routerLink="/portfolio" 
           routerLinkActive="text-[#FE4F2D]"
           class="block text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors"
           (click)="toggleMenu()">
          Portfolio
        </a>
        <a routerLink="/services" 
           routerLinkActive="text-[#FE4F2D]"
           class="block text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors"
           (click)="toggleMenu()">
          Services
        </a>
        <a routerLink="/testimonials" 
           routerLinkActive="text-[#FE4F2D]"
           class="block text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors"
           (click)="toggleMenu()">
          Testimonials
        </a>
        <a routerLink="/contact" 
           routerLinkActive="text-[#FE4F2D]"
           class="block text-[#015551] dark:text-[#FDFBEE] hover:text-[#57B4BA] dark:hover:text-[#57B4BA] transition-colors"
           (click)="toggleMenu()">
          Contact
        </a>
      </div>
    </div>
  </nav>
</header>

<!-- Hidden Resume Link with Keyboard Shortcut -->
<a routerLink="/resume" id="resume-shortcut" class="hidden"></a>

<!-- Hidden Login Link with Keyboard Shortcut -->
<a routerLink="/login" id="login-shortcut" class="hidden"></a>

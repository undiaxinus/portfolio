<section class="py-20 bg-[#FDFBEE] dark:bg-[#015551]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold text-[#015551] dark:text-[#FDFBEE] mb-4">My Services</h2>
      <div class="w-24 h-1 bg-gradient-to-r from-[#57B4BA] to-[#FE4F2D] mx-auto"></div>
    </div>

    <!-- Services Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let service of services" 
           class="group bg-white/50 dark:bg-[#015551]/50 backdrop-blur-sm rounded-xl p-6
                  transform transition-all duration-300 hover:scale-105 hover:shadow-xl
                  border border-[#57B4BA]/10 hover:border-[#57B4BA]/30">
        <!-- Icon -->
        <div class="w-16 h-16 mb-6 text-[#FE4F2D] group-hover:text-[#57B4BA] transition-colors"
             [innerHTML]="service.icon">
        </div>

        <!-- Content -->
        <h3 class="text-xl font-bold text-[#015551] dark:text-[#FDFBEE] mb-4">{{service.title}}</h3>
        <p class="text-[#015551]/80 dark:text-[#FDFBEE]/80 mb-6">{{service.description}}</p>

        <!-- Features -->
        <ul class="space-y-3">
          <li *ngFor="let feature of service.features" 
              class="flex items-center text-[#015551]/70 dark:text-[#FDFBEE]/70">
            <svg class="w-5 h-5 mr-2 text-[#57B4BA]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            {{feature}}
          </li>
        </ul>

        <!-- Hover Decoration -->
        <div class="absolute -z-10 inset-0 bg-gradient-to-br from-[#57B4BA]/5 to-[#FE4F2D]/5 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
      </div>
    </div>
  </div>
</section>
